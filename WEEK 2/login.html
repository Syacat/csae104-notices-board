<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don Mariano Marcos Memorial State University | Login</title>
<link rel="stylesheet" href="styles1.css"></head>
<body>
<header class="top"><div class="seal"><img src="logo.jpeg" alt="DMMMSU Logo"></div><div class="school">Don Mariano Marcos Memorial State University</div></header>
<nav aria-label="Main navigation"><a class="active" href="#home">Home</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#register">Register</a></nav>
<main id="home">
<section class="login"><h1>Login Form</h1><form id="loginForm"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Login</button><div class="message" id="message" role="status"></div></form></section>
<div class="hero"><img src="image.jpeg" alt="DMMMSU campus image"></div>
</main>

<footer class="site-footer">
  <span>© 2026 DMMMSU</span>
  <span>All Rights Reserved</span>
</footer>

<script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('message').textContent='Demo page: connect this form to your login system to authenticate users.';});</script>
</body></html>
