<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="colorMessage">Choose Your Color</h1>

    <div class="container">

        <div class="card">
            <h2>Blue</h2>
            <p>Change the background to blue.</p>
            <button id="blue">Choose Blue</button>
        </div>

        <div class="card">
            <h2>Red</h2>
            <p>Change the background to red.</p>
            <button id="red">Choose Red</button>
        </div>

        <div class="card">
            <h2>Yellow</h2>
            <p>Change the background to yellow.</p>
            <button id="yellow">Choose Yellow</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
